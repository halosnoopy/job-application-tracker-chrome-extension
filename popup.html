<!DOCTYPE html>
<html>

<head>
  <title>Job Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h2>Save Job Application</h2>

  <div class="popup-row three-col">
    <div>
      <label>Company</label>
      <input type="text" id="company" placeholder="Company name">
    </div>

    <div>
      <label>Job Title</label>
      <input type="text" id="jobTitle" placeholder="Job title">
    </div>

    <div>
      <label>Platform</label>
      <select id="platform">
        <option value="LinkedIn">LinkedIn</option>
        <option value="Workday">Workday</option>
        <option value="Greenhouse">Greenhouse</option>
        <option value="Lever">Lever</option>
        <option value="Indeed">Indeed</option>
        <option value="Company Website">Company Website</option>
        <option value="Ashby">Ashby</option>
        <option value="Gem">Gem</option>
        <option value="Other">Other</option>
      </select>
    </div>
  </div>

  <div class="popup-row two-col">
    <div>
      <label>Status</label>
      <select id="status">
        <option value="Submitted">Submitted</option>
        <option value="HR Reachout">HR Reachout</option>
        <option value="Phone Screen">Phone Screen</option>
        <option value="Interview">Interview</option>
        <option value="Final Interview">Final Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
        <option value="Withdrawn">Withdrawn</option>
      </select>
    </div>

    <div>
      <label>Application Date</label>
      <input type="date" id="applicationDate">
    </div>
  </div>

  <label>Notes</label>
  <textarea id="notes" placeholder="Optional notes"></textarea>

  <input type="hidden" id="extractedUrl">

  <div class="extract-actions">
    <button id="extractBtn">Local Extract</button>
    <button id="aiExtractBtn">AI Extract</button>
  </div>

  <!--
    Debug Extract is a temporary troubleshooting control for extraction issues.
    Re-enable this button when a job board changes its DOM and we need to copy
    frame-by-frame extraction candidates for diagnosis.
  -->
  <!-- <button id="debugExtractBtn" class="secondary-btn">Debug Extract</button> -->
  <button id="saveBtn" class="primary-btn">Save Application</button>
  <button id="dashboardBtn" class="secondary-btn">Open Dashboard</button>

  <p id="message"></p>

  <section id="emailUpdatePanel" class="email-update-panel" style="display: none;">
    <h3>Email Status Update</h3>
    <div id="emailUpdateSummary" class="email-update-summary"></div>

    <label for="emailMatchSelect">Match saved application</label>
    <select id="emailMatchSelect"></select>

    <div class="popup-row two-col">
      <div>
        <label for="emailStatusSelect">Detected status</label>
        <select id="emailStatusSelect">
          <option value="HR Reachout">HR Reachout</option>
          <option value="Phone Screen">Phone Screen</option>
          <option value="Interview">Interview</option>
          <option value="Final Interview">Final Interview</option>
          <option value="Offer">Offer</option>
          <option value="Rejected">Rejected</option>
          <option value="Withdrawn">Withdrawn</option>
          <option value="No status change">No status change</option>
        </select>
      </div>

      <div>
        <label for="emailStatusDate">Status date</label>
        <input id="emailStatusDate" type="date">
      </div>
    </div>

    <label for="emailStatusNote">Timeline note</label>
    <textarea id="emailStatusNote" placeholder="Email update note"></textarea>

    <div class="extract-actions">
      <button id="applyEmailUpdateBtn">Update Timeline</button>
      <button id="cancelEmailUpdateBtn">Cancel</button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>

</html>
